name: namanmu

services:
    postgres:
        image: postgres:18
        container_name: namanmu-postgres
        environment:
            POSTGRES_DB: ${NMM_DB_DATABASE:?NMM_DB_DATABASE is required}
            POSTGRES_USER: ${NMM_DB_USERNAME:?NMM_DB_USERNAME is required}
            POSTGRES_PASSWORD: ${NMM_DB_PASSWORD:?NMM_DB_PASSWORD is required}
            PGDATA: /var/lib/postgresql/data/pgdata
        ports:
            - "${NMM_POSTGRES_PORT:?NMM_POSTGRES_PORT is required}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
            interval: 5s
            timeout: 5s
            retries: 10

    api-server:
        build:
            context: .
            dockerfile: apps/api-server/Dockerfile
            target: development
        image: namanmu-api-server:dev
        container_name: namanmu-api-server
        command: sh -c "npm run build -w @nmm/shared && cd apps/api-server && npx nest start --watch"
        depends_on:
            postgres:
                condition: service_healthy
        env_file:
            - apps/api-server/.env
        environment:
            NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
            PORT: ${PORT:?PORT is required}
            NMM_API_ORIGIN: ${NMM_API_ORIGIN:?NMM_API_ORIGIN is required}
            NMM_WEB_ORIGIN: ${NMM_WEB_ORIGIN:?NMM_WEB_ORIGIN is required}
            NMM_DB_HOST: ${NMM_DB_HOST:?NMM_DB_HOST is required}
            NMM_DB_PORT: ${NMM_DB_PORT:?NMM_DB_PORT is required}
            NMM_DB_USERNAME: ${NMM_DB_USERNAME:?NMM_DB_USERNAME is required}
            NMM_DB_PASSWORD: ${NMM_DB_PASSWORD:?NMM_DB_PASSWORD is required}
            NMM_DB_DATABASE: ${NMM_DB_DATABASE:?NMM_DB_DATABASE is required}
            NMM_DB_SYNCHRONIZE: ${NMM_DB_SYNCHRONIZE:?NMM_DB_SYNCHRONIZE is required}
            NMM_DB_LOGGING: ${NMM_DB_LOGGING:?NMM_DB_LOGGING is required}
            NMM_DB_MANUAL_INITIALIZATION: ${NMM_DB_MANUAL_INITIALIZATION:?NMM_DB_MANUAL_INITIALIZATION is required}
            NMM_AUTH_SECRET: ${NMM_AUTH_SECRET:?NMM_AUTH_SECRET is required}
            NMM_AUTH_SIGNUP_REDIRECT_PATH: ${NMM_AUTH_SIGNUP_REDIRECT_PATH:?NMM_AUTH_SIGNUP_REDIRECT_PATH is required}
            NMM_AUTH_ERROR_REDIRECT_PATH: ${NMM_AUTH_ERROR_REDIRECT_PATH:?NMM_AUTH_ERROR_REDIRECT_PATH is required}
            NMM_AUTH_COOKIE_SECURE: ${NMM_AUTH_COOKIE_SECURE:?NMM_AUTH_COOKIE_SECURE is required}
            NMM_OAUTH_GITHUB_CLIENT_ID: ${NMM_OAUTH_GITHUB_CLIENT_ID:?NMM_OAUTH_GITHUB_CLIENT_ID is required}
            NMM_OAUTH_GITHUB_CLIENT_SECRET: ${NMM_OAUTH_GITHUB_CLIENT_SECRET:?NMM_OAUTH_GITHUB_CLIENT_SECRET is required}
        ports:
            - "${PORT:?PORT is required}:${PORT:?PORT is required}"
        volumes:
            - .:/app
            - node_modules:/app/node_modules

volumes:
    node_modules:
    postgres_data:
